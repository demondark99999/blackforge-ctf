# Configuración básica de Snort para BlackForge Labs
# Entorno Secundario - Enfocado en detección y registro

# Variables de red
ipvar HOME_NET any
ipvar EXTERNAL_NET any

# Rutas de configuración
var RULE_PATH /etc/snort/rules
var SO_RULE_PATH /etc/snort/sorules
var PREPROC_RULE_PATH /etc/snort/preproc_rules

# Rutas de salida
var LOG_DIR /var/log/snort
var ARCHIVE_DIR /var/log/snort/archive

# Configuración de decodificadores
config disable_decode_alerts
config disable_encode_alerts
config disable_ethdec_alerts
config disable_ipdec_alerts
config checksum_mode: none

# Configuración de detección de pobreza
config detection: search-method ac
config detection: search-optimize
config detection: search-method-bm

# Preprocesadores esenciales
preprocessor frag3_engine: max_frags 65536
preprocessor stream5_global: track_tcp yes, \
                           track_udp yes, \
                           track_icmp yes, \
                           max_tcp 262144, \
                           max_udp 136200, \
                           max_icmp 4120, \
                           memcap 10485760
preprocessor stream5_tcp: policy windows, \
                          ignore_ports noise, \
                          require_3whs 1800, \
                          stop_on_overlap 1, \
                          reset_on_overlap 1, \
                          overlap_limit 10, \
                          min_ttl 1, \
                          max_window 65535, \
                          track_action yes, \
                          annotate_tx 1, \
                          detect_anomalies 1, \
                          require_handshake 1, \
                          detect_spoof 1, \
                          max_queue_bytes 100000
preprocessor stream5_udp: track_udp yes, \
                          max_udp 136200, \
                          memcap 4194304

# Inclusión de reglas estándar
include $RULE_PATH/local.rules
include $RULE_PATH/snort.rules

# Configuración de salida
output alert_fast: stdout
output log_tcpdump: /var/log/snort/snort.log.pcap