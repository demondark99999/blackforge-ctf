# Configuración de FRRouting para BlackForge Labs - Instalación Omega
# Entorno Secundario de Seguridad y Gestión de Red

frr version 9.0
frr defaults traditional
hostname router-omega
log syslog informational
no log stdout
service integrated-vtysh-config
!
username admin nopassword
!
service integrated-vtysh-config
!
log syslog informational
!
router bgp 65000
 bgp router-id 1.1.1.1
 no bgp default ipv4-unicast
 distance bgp 20 200 200
 !
 address-family ipv4 unicast
  network 172.20.0.0/16
  network 172.21.0.0/16
  network 172.22.0.0/16
  network 172.23.0.0/16
  neighbor 172.20.0.2 remote-as 65001
  neighbor 172.21.0.2 remote-as 65002
  neighbor 172.22.0.2 remote-as 65003
  neighbor 172.23.0.2 remote-as 65004
 exit-address-family
!
router ospf
 ospf router-id 1.1.1.1
 ! Red de gestión
 network 172.20.0.0/16 area 0.0.0.0
 ! Red DMZ
 network 172.21.0.0/16 area 0.0.0.0
 ! Red interna
 network 172.22.0.0/16 area 0.0.0.0
 ! Red de monitoreo
 network 172.23.0.0/16 area 0.0.0.0
 passive-interface default
 no passive-interface eth0
!
router rip
 version 2
 network 172.20.0.0/16
 network 172.21.0.0/16
 network 172.22.0.0/16
 network 172.23.0.0/16
 no auto-summary
!
line vty
 exec-timeout 0 0
!
end