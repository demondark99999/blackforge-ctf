# Configuración de sitio para BlackForge Labs - Instalación Omega
# Entrenamiento CTF - Aplicación web principal

# Servidor HTTP (redirige a HTTPS)
server {
    listen 80;
    server_name forge.local www.forgelabs.local;

    # Redirección a HTTPS
    return 301 https://$server_name$request_uri;
}

# Servidor HTTPS
server {
    listen 443 ssl http2;
    server_name forge.local www.forgelabs.local;

    # Configuración SSL (usando certificados auto-firmados para entrenamiento)
    ssl_certificate           /etc/nginx/ssl/forge.local.crt;
    ssl_certificate_key       /etc/nginx/ssl/forge.local.key;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_tickets       off;

    # Configuración moderna de SSL (adaptada para entrenamiento)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (desactivado para facilitar ejercicios de entrenamiento)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Headers de seguridad
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Ruta raíz
    root /var/www/html;
    index index.php index.html index.htm;

    # Registro de logs específicos para este sitio
    access_log  /var/log/nginx/forge.access.log  main;
    error_log   /var/log/nginx/forge.error.log   warn;

    # Manejo de solicitudes PHP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # Vulnerabilidad intencional: configuración de fastcgi que podría permitir ciertos ataques en versiones antiguas
        fastcgi_pass   web-app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # Servir archivos estáticos directamente
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Bloquear acceso a archivos sensibles
    location ~ /\.ht {
        deny all;
    }

    location ~* \.(sql|log|bak|backup|old|tmp|temp)$ {
        deny all;
        return 403;
    }

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        return 200 'OK\n';
        add_header Content-Type text/plain;
    }
}