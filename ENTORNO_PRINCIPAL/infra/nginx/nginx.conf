# Configuración principal de NGINX para BlackForge Labs - Instalación Omega
# Proxy inverso y balanceador de carga para entorno de entrenamiento CTF

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # Configuración básica
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Registro de logs
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # Configuración de rendimiento
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Compresión
    gzip  on;
    gzip_vary   on;
    gzip_min_length  1024;
    gzip_proxied    expired no-cache no-store private must_reauth;
    gzip_types      text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml;

    # Seguridad básica
    server_tokens off;

    # Configuración de proxypass
    proxy_temp_path   /var/tmp/nginx_proxy;
    proxy_cache_path  /var/tmp/nginx_cache levels=1:2 keys_zone=STATIC:10m inactive=60m max_size=100m;

    # Tiempo de espera para proxypass
    proxy_connect_timeout   60s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_send_lowat        12000;

    # Incluir configuraciones de sitios
    include /etc/nginx/sites-available/*.conf;
}