# Configuración de Redis para BlackForge Labs - Instalación Omega
# Arquitectura de entrenamiento CTF

# Puerto
port 6379

# Modo protegido (desactivado para facilitar conexiones en entorno de entrenamiento)
protected-mode no

# Timeout de conexión
timeout 0

# TCP keepalive
tcp-keepalive 300

# Registro de logs
loglevel notice
logfile ""

# Número de bases de datos
databases 16

# Persistencia RDB
save 900 1
save 300 10
save 60 10000

# Compresión RDB
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Persistencia AOF
appendonly no
appendfilename "appendonly.aol"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Límites de clientes
maxclients 10000

# Uso de memoria
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Seguridad (reducida para entorno de entrenamiento)
requirepass ${REDIS_PASSWORD}

# Compatibilidad
rehash-lookup-hit 0.001