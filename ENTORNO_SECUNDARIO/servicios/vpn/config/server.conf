# Configuración de OpenVPN Server para BlackForge Labs - Instalación Omega
# Entorno Secundario de Seguridad y Gestión de Red

# Configuración básica del servidor
port 1194
proto udp
dev tun
ca ca.crt
cert server.crt
key server.key  # Este archivo debe estar protegido
dh dh2048.pem
topology subnet

# Configuración de la red VPN
server 10.8.0.0 255.255.255.0
ifconfig-pool-persist ipp.txt

# Rutas para acceder a la red interna desde clientes VPN
push "route 172.20.0.0 255.255.0.0"
push "route 172.21.0.0 255.255.0.0"
push "route 172.22.0.0 255.255.0.0"
push "route 172.23.0.0 255.255.0.0"

# Configuración de DNS para clientes VPN
push "dhcp-option DNS 10.8.0.1"
push "dhcp-option DOMAIN blackforge.local"

# Mantener la conexión activa
keepalive 10 120
tls-auth ta.key 0
cipher AES-256-CBC
auth SHA256

# Configuración de compresión y escalado
compress lz4-v2
push "compress lz4-v2"

# Límites de clientes y persistencia
max-clients 100
user nobody
group nogroup
persist-key
persist-tun

# Estado y logging
status /var/log/openvpn/openvpn-status.log
log-append  /var/log/openvpn/openvpn.log
verb 3
explicit-exit-notify 1

# Configuración de redes específicas para entrenamiento
# Permitir acceso a servicios específicos del entorno principal
push "route 172.18.0.0 255.255.0.0"  # Asumiendo que el entorno principal usa esta red