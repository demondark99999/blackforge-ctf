# Configuración de vsftpd para BlackForge Labs - Instalación Omega
# Entorno de entrenamiento CTF - Configuración con vulnerabilidades intencionales

# Configuración básica
listen=YES
anonymous_enable=NO
local_enable=YES
virtual_use_local_privs=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
xferlog_std_format=YES
chroot_local_user=YES
chroot_list_enable=YES
chroot_list_file=/etc/vsftpd.chroot_list
ls_recurse_enable=YES

# Seguridad y límites
max_clients=50
max_per_ip=5
pasv_enable=YES
pasv_min_address=127.0.0.1
pasv_max_address=127.0.0.1
pasv_min_port=${PASV_MIN_PORT}
pasv_max_port=${PASV_MAX_PORT}
# Vulnerabilidad intencional: PASV_ADDRESS configurado para permitir ataque de rebote FTP
pasv_address=${PASV_ADDRESS}

# Autenticación de usuarios virtuales
pam_service_name=vsftpd
guest_enable=YES
virtual_use_local_privs=YES
user_sub_token=$USER
local_root=/home/vsftpd/$USER
hide_ids=YES

# Registro de logs
xferlog_file=/var/log/vsftpd.log
log_ftp_protocol=YES
dual_log_enable=YES
vsftpd_log_file=/var/log/vsftpd.log

# Banderas de seguridad (algunas desactivadas intencionalmente para entrenamiento)
ssl_enable=NO
allow_anon_ssl=NO
force_local_data_ssl=NO
force_local_logins_ssl=NO

# Configuración de usuarios
userlist_enable=YES
userlist_file=/etc/vsftpd.user_list
userlist_deny=NO

# Límite de tamaño de archivo
file_open_mode=0666