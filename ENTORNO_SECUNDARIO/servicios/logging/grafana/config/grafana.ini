# Configuración básica de Grafana para BlackForge Labs
# Entorno Secundario - Visualización y paneles de monitoreo

[server]
# Protocolo (http, https, socket)
protocol = http

# La dirección IP a escuchar o vacía para todas las interfaces
;http_addr =

# El puerto HTTP para escuchar
http_port = 3000

# El prefijo de dominio que se utiliza para que Grafana sea accesible a través de un subdominio
;domain =

# Redirigir al dominio correcto si el encabezado del host no coincide con el dominio
;redirect_to_domain_corrected = true

# La dirección IP completa a utilizar si se establece, de lo contrario se utiliza http_addr
;router_logger.enabled = false

# El registro de solicitudes entrantes de HTTP
[log]
modo = consola
nivel = info
formato = texto

[dataproxy]

[dataproxy.timeout]
timeout = 0
dial_timeout = 0
keep_alive_seconds = 0

[security]
# deshabilitar gravatar de perfil
disable_gravatar = true

# establecer a true si desea permitir que los usuarios creen cuentas
# a través de la página de registro de приглашения
allow_sign_up = false

# establecer a true para permitir que los usuarios inicien sesión desde
# sistema de autenticación ( Google o Azure Active Directory etc )
auto_login = false

# establecer este opción a true si desea ver el correo electrónico en la vista de lista de usuarios
# si se establece en false, el correo electrónico será ocultado
login_remember_days = 7
cookie_username = grafana_user
cookie_remember_name = grafana_remember
disable_brute_force_login_prevention = false

[users]
# deshabilitar asignación de organización
disable_login_org_form = true

[auth.anonymous]
# habilitar acceso anónimo
enabled = false
# nombre de organización para usuarios anónimos
org_name = Main Org.
# rol para usuarios anónimos
org_role = Viewer

[auth.github]
enabled = false
allow_sign_up = true

[auth.gitlab]
enabled = false
allow_sign_up = true

[auth.microsoft]
enabled = false
allow_sign_up = true

[auth.ldap]
enabled = false

[auth.saml]
enabled = false

[auth.openid]
enabled = false

[auth.google]
enabled = false
allow_sign_up = true

[auth.azuread]
enabled = false
allow_sign_up = true

[auth.okta]
enabled = false

[auth.github_team]
enabled = false

[auth.gitlab_team]
enabled = false

[auth.okta_team]
enabled = false

[auth.google_team]
enabled = false

[auth.azuread_team]
enabled = false

[auth.okta_group]
enabled = false

[auth.site_admin]
enabled = false

[auth.proxy]
enabled = false

[auth.jwt]
enabled = false

[snapshots]
externally_enabled = false
externally_name = snapshots-api
externally_url = http://localhost:3000/api/snapshots
externally_timeout = 30
# Eliminado para entrenamiento

[annotations]
[annotations.dashboard]
[annotations.alertlist]

[explore]

[expressions]

[unified_alerting]
enabled = true
# para estándares abiertos, establezca esto a true
namespace_labels = -(hora)
# para estándares abiertos, establezca esto a true
namespace_annotations = -(hora)
# ejecución de la regla en paralelo, establezca esto a el número de gorutines a utilizar
# 0 significa basado en el número de CPU disponibles
concurrent_evaluation = 0
# por defecto, las notificaciones se envían después de que se evalúan todas las reglas
# establezca esto a true para que las notificaciones se envíen inmediatamente después de que se evalúe una regla
error_timeout = 5m
# establecer el timeout para la evaluación de la regla
evaluation_timeout = 2m
# establecer el timeout para la notificación de la regla
notification_timeout = 30s
# establezca el número máximo de intentos para enviar notificaciones
max_attempts = 3
# establecer el intervalo de tiempo para volver a intentar enviar notificaciones
retry_interval = 1m

[unified_alerting.critique]
enabled = true

[unified_alerting.notification]
# definir plantillas de notificación aquí

[unified_alerting.state_history]
# para standards abiertos, establezca esto a 30d
retention_days = 0

[live]
# specify the maximum session lifetime in seconds
# 0 means the session will last forever
max_lifetime = 1800
# specify the amount of time allowed for a dirty write e.g. when a user is taking the
# snapshot and the server needs to save it to disk
dirtywrite_timeout = 600

[feature_toggles]
# enable toggle
enabled = false

[panel]
# disable sanitization of HTML
disable_sanitize_html = false
# make panel titles editable
# makes panel titles editable, to enable set to true
title_tooltip_max_width = 500
# sets the default new panel width and height that is used when creating a new panel via drag-and-drop in dashboard view
default_panel_width = 12
default_panel_height = 8
# sets the default title for panels
# set to an empty string to use "Panel"
panel_title_default_value = Panel
# sets the default desc for panels
# set to an empty string to use ""
panel_description_default_value =

[plugins]
# lista separada por comas de identificadores de plugins para cargar, vacía para cargar todos
# por ejemplo:
# plugins = grafana-image-renderer,grafana-worldmap-panel
enable_alpha = false
# lista separada por comas de identificadores de plugins para renderizar, vacía para cargar todos
# por ejemplo:
# plugins_awaiting_initialization = grafana-image-renderer
loading_timeout = 0
# establecer esto a true para cargar plugins incluso si no se encuentran en la carpeta de plugins
# esto es útil para solicitar el loading mediante network tabs, si falla el plugin se mostrará como enabled in UI
allow_loading_unsigned_plugins = false

[http_server]
# configuración de escritura de servidores HTTP
# write_timeout = 15
# idle_timeout = 120
# max_header_bytes = 1024000
# esta debe ser un entero que represente el número máximo de conexiones concurrentes
# que escuchará el servidor HTTP, si se establece en 0, se determinará en tiempo de ejecución
# basado en el número de CPU disponibles
#max_connections = 100
# establecer esto a true para escribir conexiones y solicitudes a los registros
# con refer to the logger configuration above
socket =

[http_server.header]
# an example of a HTTP header key value pair (for example: Server: Apache Server/2.4.1)
#Server = Apache Server/2.4.1

[http_server.footer]

[database]
# إما seja burgerão, mysql 或 postgres,sqlite3
type = sqlite3
path = /var/lib/grafana/grafana.db
# Para el modo de servidor, la URL debe estar en el formato de usuario:contraseña@protocolo(dirección:puerto)/nombre
# ejemplos:
#   mysql2://user:pass@tcp(127.0.0.1:3306)/mysqldb?param=value
#   postgres://user:pass@pghost:pgport/pgdb?sslmode=disable&connect_timeout=10
# Myself only support the URL format
url =

# Para sqlite3 solo, el path es relativo al directorio de instalacion de grafana
#   path = /var/lib/grafana/grafana.db

[session]
# opciones de configuración http://www.session(dot)net/
provider = file

[session.provider]
# options for redis sessions
# �� 必须是数字
#网�络超时/时延，可以为负值
#网�络接口名称

[analytics]
# Envío de informes de uso a https://stats.grafana.org
check_for_updates = true
# Google Analytics UUID implementado por grafana/google-analytics
google_analytics_uei = UA-57337904-1
# Check for plugin updates cada 24 horas
check_for_plugin_updates = true

[grafana_net]
url = https://grafana.net

[logs]
# Console logger mode can be "console" or "json"
mode = console
# Either "trace", "debug", "info", "warn", "error"
level = info

[metrika]
enabled = false

[graphite]
# Specify the timeout in seconds
timeout = 10

[influxdb]

[opentsdb]

[azuremonitor]

[opentelemetry]

[awscloudwatch]

[azuremonitor_logs]

[diaogrammer]

[distributed_tracing]

[enterprise]
# Ruta a un archivo de licencia de empresa
#license_path =

