# Configuración básica de Logstash para BlackForge Labs
# Entorno Secundario - Procesamiento de logs desde Beats

input {
  beats {
    port => 5044
  }
}

filter {
  # Ejemplo de filtro para logs de Syslog
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:%{@timestamp}} %{SYSLOGHOST:%{hostname}} %{DATA:msg}(?: %{DATA:pid})?:" }
    }
    date {
      match => [ "@timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }

  # Ejemplo de filtro para logs de Apache/Nginx
  if [type] == "apache-access" {
    grok {
      match => { "request" => "%{METHOD:method} %{URIPATHPARAM:url} %{HTTPVERSION:version}" }
    }
    geoip {
      source => "clientip"
    }
    useragent {
      source => "agent"
      target => "ua"
    }
    urldecode {
      fields => ["url"]
    }
  }

  # Filtrar y añadir campos comunes
  if [@timestamp] {
    date {
      match => [ "@timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  # Envío a Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "blackforge-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "changeme"
  }

  # También guardar en archivo para diagnóstico
  file {
    path => "/var/log/logstash/logstash-%{+YYYY.MM.dd}.log"
    codec => rubydebug
  }
}